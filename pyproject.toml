[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mecha-video"
version = "0.1.0"
description = "An assistant-operated, versioned workspace for original explainer videos"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
animation = ["manim==0.19.0"]

[project.scripts]
mecha = "mecha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
